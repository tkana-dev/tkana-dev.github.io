<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>tkana.dev</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Software engineer building personal projects." />

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #eaeaea;
      --accent: #7b6cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 40px 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 12px 0;
      letter-spacing: 0.02em;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 24px 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 16px;
    }

    a {
      font-size: 0.9rem;
      color: var(--text);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>tkana</h1>

    <p>Software engineer building personal projects.</p>

    <ul>
      <li>
        <a href="https://github.com/tkana-dev" target="_blank" rel="noopener noreferrer">
          GitHub
        </a>
      </li>
      <li>
        <a href="https://x.com/tkana_dev" target="_blank" rel="noopener noreferrer">
          X
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
